format_version: 2
output_root: data/models/benchmark

dataset:
  # Controlled models receive these same 64 causal values. Sequence families retain the
  # 16-by-4 shape; tabular families receive the identical values flattened.
  window_length: 16
  feature_columns:
    - open_gap
    - body
    - high_from_close
    - low_from_close

protocol:
  # Eligibility remains strict: scheduled-status evidence, available condition, complete grid,
  # and the existing prior-close trust chain. Only complete annotations enter this population.
  rules:
    version: generalized_chronological_90_10_v1
    test_fraction: 0.10
    initial_training_fraction: 0.50
    learning_evaluation_fraction: 0.10
    fold_count: 5
    learning_curve_fractions: [0.10, 0.25, 0.50, 0.75, 1.0]
    minimum_training_sessions: 30
    minimum_validation_sessions: 5
    minimum_test_sessions: 5
    minimum_curve_sessions: 3
  controlled_first_scored_candle_position: 15
  best_of_family_first_scored_candle_position: 1

tuning:
  primary_metric: mean_head_macro_f1
  # Tuning uses one fixed seed to compare configurations economically. The frozen winner then
  # receives three independent final seeds so its result does not depend on one lucky start.
  tuning_seed: 8675309
  final_seeds: [42, 137, 271]
  # A single CPU worker makes runtime evidence reproducible and avoids nested library pools.
  cpu_worker_count: 1
  inference_timing_repetitions: 3
  pilot_max_estimated_hours: 24.0
  pilot_max_dense_memory_gib: 8.0
  # Always include the established small-corpus Transformer as one candidate so a stochastic
  # search cannot omit the strongest known architecture by chance.
  transformer_incumbent:
    context_length: 16
    model_dimension: 12
    layer_count: 4
    attention_head_count: 4
    feedforward_dimension: 48
    dropout: 0.1
    learning_rate: 0.001
    weight_decay: 0.01
    batch_size: 8
    epochs: 50
  # Budgets limit completed Optuna candidates per family; parameter-free baselines need none.
  candidate_budgets:
    majority_class: 0
    previous_regime: 0
    gaussian_naive_bayes: 10
    logistic_regression: 20
    polynomial_logistic: 20
    knn: 20
    decision_tree: 25
    random_forest: 30
    gradient_boosting: 30
    rbf_svm: 25
    mlp: 25
    tcn: 25
    gru: 25
    transformer: 25

# Use setuptools to package the source tree and install the CLI entry points below.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pricesanity"
version = "0.1.0"
description = "A Transformer for learning candle-by-candle market interpretation."
readme = "README.md"
requires-python = ">=3.11"

# Keep data preparation dependencies available without requiring the optional GUI.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    # Retain the SDK minor version used to validate download and CSV behavior.
    "databento>=0.86,<0.87",
]

# Separate entry points expose estimation, preparation, annotation, and managed downloading.
[project.scripts]
pricesanity-prepare = "pricesanity.data.build_dataset:main"
pricesanity-estimate = "pricesanity.data.databento_fetch:main"
pricesanity-download = "pricesanity.data.databento_fetch:download_main"
pricesanity-annotate = "pricesanity.gui.annotation_launcher:main"

[project.optional-dependencies]
# Tests and exploratory notebooks are development tools rather than runtime requirements.
dev = [
    "pytest>=8.2",
    "jupyterlab>=4.2",
    "matplotlib>=3.8",
]

# The annotation application needs Qt and plotting, but headless preparation does not.
gui = [
    "matplotlib>=3.8",
    "PySide6>=6.7",
]

# Discover packages under src so repository utilities are not installed as application code.
[tool.setuptools.packages.find]
where = ["src"]

# Limit test discovery to maintained fixtures rather than local data or exploratory notebooks.
[tool.pytest.ini_options]
testpaths = ["tests"]

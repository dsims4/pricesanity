[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pricesanity"
version = "0.1.0"
description = "A Transformer for learning candle-by-candle market interpretation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "databento>=0.86,<0.87",
]

[project.scripts]
pricesanity-prepare = "pricesanity.data.build_dataset:main"
pricesanity-estimate = "pricesanity.data.databento_fetch:main"
pricesanity-download = "pricesanity.data.databento_fetch:download_main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "jupyterlab>=4.2",
    "matplotlib>=3.8",
]
gui = [
    "matplotlib>=3.8",
    "PySide6>=6.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
